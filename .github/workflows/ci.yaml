name: 🚀 Build workflow on test environment

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. GitHub 리포지토리에서 코드 체크아웃
      - name: ✅ 브랜치 체크아웃
        uses: actions/checkout@v4

      # 2. Gradle 캐싱
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 3. Gradle 권한 변경
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # 4. Gradle로 프로젝트 빌드
      - name: 📦 프로젝트 빌드
        run: ./gradlew build --no-daemon
